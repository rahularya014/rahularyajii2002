            height: 140vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
            filter: blur(90px); /* Huge blur for the liquid merge effect */
        }

        .liquid-blob {
            position: absolute;
            mix-blend-mode: screen;
            animation: fluidMorph 25s ease-in-out infinite alternate;
            opacity: 0.7;
        }

        /* Front Layer Liquid */
        .blob-1 {
            width: 55vw;
            height: 55vw;
            background: radial-gradient(circle, rgba(255,42,95,0.8) 0%, transparent 70%);
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            transform-origin: center;
        }

        .blob-2 {
            width: 65vw;
            height: 65vw;
            background: radial-gradient(circle, rgba(128,0,28,0.9) 0%, transparent 70%);
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
            transform-origin: top left;
        }

        /* Deep Layer Liquid (for depth) */
        .blob-3 {
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(255,0,55,0.6) 0%, transparent 70%);
            top: 40%;
            left: 40%;
            animation-delay: -10s;
            transform-origin: bottom right;

        .blob-4 {

            height: 75vw;
            background: radial-gradient(circle, rgba(16,83,255,0.35) 0%, transparent 70%); /* Deep blue for liquid shadows */
            bottom: -15%;
            left: -15%;
            animation-delay: -15s;
            transform-origin: center;
        }

        @keyframes fluidMorph {
            0% {
                border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%;
                transform: translate(0, 0) rotate(0deg) scale(1);
            }
            33% {
                border-radius: 70% 30% 50% 50% / 30% 30% 70% 70%;
                transform: translate(8vw, -8vh) rotate(120deg) scale(1.1);
            }
            66% {
                border-radius: 100% 60% 60% 100% / 100% 100% 60% 60%;
                transform: translate(-8vw, 10vh) rotate(240deg) scale(0.9);
            }
            100% {
                border-radius: 40% 60% 70% 30% / 40% 40% 60% 50%;
                transform: translate(0, 0) rotate(360deg) scale(1);
            }
        }

            // Values for the spotlight (center of screen by default)

            const springConfig = { damping: 50, stiffness: 200, mass: 1 };

            const smoothY = useSpring(mouseY, springConfig);

            const translateY = useTransform(smoothY, [-0.5, 0.5], [60, -60]);
            
            // Inverse movement for deeper fluid layers to create parallax depth

                        mouseY.set(e.clientY / window.innerHeight - 0.5);

                } else {
                    document.body.style.overflow = 'unset';
                }
            }, [cmdKOpen]);

            useEffect(() => {
                // Initialize Lucide icons after render
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            return (
                <div className="antialiased selection:bg-accent/30 selection:text-white min-h-screen flex flex-col relative">
                    <BackgroundEffects />
                    <CommandPalette isOpen={cmdKOpen} onClose={() => setCmdKOpen(false)} />
                    
                    <Navbar toggleCmdK={toggleCmdK} />
                    
                    <main className="flex-grow">
                        <Hero toggleCmdK={toggleCmdK} />
                        <About />
                        <Experience />
                        <Projects />
                        <EducationAndAchievements />
                        <Contact />
                    </main>

                    <Footer />
                </div>
            );
        };

        // Render Application
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
